name: fitplan-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitplan
      POSTGRES_USER: fitplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - fitplan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitplan -d fitplan"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/fitplan
      DB_USERNAME: fitplan
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?Set DASHSCOPE_API_KEY}
      FITPLAN_AUTH_REGISTRATION_ENABLED: ${FITPLAN_AUTH_REGISTRATION_ENABLED:-true}
      FITPLAN_CORS_ALLOWED_ORIGINS: ${FITPLAN_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      FITPLAN_RAG_INDEX_ON_STARTUP: ${FITPLAN_RAG_INDEX_ON_STARTUP:-true}
      FITPLAN_RISK_CLASSIFIER_ENABLED: ${FITPLAN_RISK_CLASSIFIER_ENABLED:-true}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
    volumes:
      - fitplan-memory:/app/Data/memory
      - fitplan-artifacts:/app/Data/memory-artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    ports:
      - "${FITPLAN_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  fitplan-pgdata:
  fitplan-memory:
  fitplan-artifacts:
