services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fitplan-postgres
    environment:
      POSTGRES_DB: fitplan
      POSTGRES_USER: fitplan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - fitplan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitplan -d fitplan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fitplan-pgdata:
